name: Publicar test de Excel en GitHub Pages

# Copia la carpeta test-excel/ a la rama gh-pages, que es la que sirve GitHub Pages.
on:
  push:
    branches: [main, claude/excel-test-platform-ciyasb]
    paths: ["test-excel/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test-excel
          publish_branch: gh-pages
          enable_jekyll: false
